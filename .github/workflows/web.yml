name: Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      # The web server compiles the app's mail code (see web/build.gradle.kts).
      - app/src/main/java/**
      - gradle/wrapper/**
      - gradlew
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      # The web server compiles the app's mail code (see web/build.gradle.kts).
      - app/src/main/java/**
      - gradle/wrapper/**
      - gradlew
      - .github/workflows/web.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test web
        run: ./gradlew -p web test installDist --console=plain

      - name: Publish web image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/kayloh20/kylie-mail-web
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" web
          docker push --all-tags "$IMAGE"
