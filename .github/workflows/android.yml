name: Android

on:
  push:
    branches: [main]
    paths:
      - app/**
      - gradle/**
      - gradlew
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/android.yml
  pull_request:
    paths:
      - app/**
      - gradle/**
      - gradlew
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/android.yml
  workflow_dispatch:

# A newer push makes an older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The APK and the tests run side by side, so the APK is ready without waiting for the tests.
  # If the tests fail, the run still goes red: don't install that APK.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD repository secrets to build a signed release."
            exit 1
          fi

      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
        run: |
          # Each APK must have a higher version code than the last to install over it. This
          # workflow's run numbers start again at 1, and APKs from the old combined workflow went up
          # to 34, so add 100.
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"
          VERSION_CODE=$VERSION_CODE ./gradlew assembleRelease --console=plain
          rm -f "$RELEASE_KEYSTORE_FILE"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/kylie-mail-$VERSION_CODE.apk"

      - name: Show version
        run: |
          # The runner has several build-tools versions; use the newest one's aapt2.
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "app/build/outputs/apk/release/kylie-mail-$VERSION_CODE.apk" \
            | head -1 | tee /dev/stderr | grep -q "versionCode='$VERSION_CODE'"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kylie-mail-${{ env.VERSION_CODE }}
          path: app/build/outputs/apk/release/kylie-mail-${{ env.VERSION_CODE }}.apk
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: app/build/reports/
