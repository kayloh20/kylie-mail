name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug --console=plain

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD repository secrets to build a signed release."
            exit 1
          fi

      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"
          ./gradlew assembleRelease --console=plain
          rm -f "$RELEASE_KEYSTORE_FILE"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/kylie-mail-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kylie-mail-${{ github.run_number }}
          path: app/build/outputs/apk/release/kylie-mail-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: app/build/reports/

  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test relay
        run: ./gradlew -p relay test installDist --console=plain

      - name: Publish relay image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/kayloh20/kylie-mail-relay
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.run_number }}" relay
          docker push --all-tags "$IMAGE"

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test web
        run: ./gradlew -p web test installDist --console=plain

      - name: Publish web image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/kayloh20/kylie-mail-web
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.run_number }}" web
          docker push --all-tags "$IMAGE"
